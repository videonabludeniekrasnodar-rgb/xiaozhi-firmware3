name: Build ESPHome Firmware

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create ESPHome config
        run: |
          cat << 'EOF' > config.yaml
          esphome:
            name: xiaozhi-radio

          esp32:
            board: esp32-c3-devkitm-1
            framework:
              type: arduino

          wifi:
            ssid: "Keenetic"
            password: "123456789"

          web_server:
            port: 80
            version: 3

          logger:
          api:
          EOF

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ESPHome
        run: pip install esphome

      - name: Compile Firmware
        run: esphome compile config.yaml

      # Автоматический перенос бинарника PlatformIO в корень для 100% стабильного скачивания
      - name: Find and Prepare Firmware File
        run: |
          mkdir -p output_bin
          ANY_BIN=$(find .esphome/build/ -type f -name "*.bin" | head -n 1)
          if [ -n "$ANY_BIN" ]; then
            cp "$ANY_BIN" output_bin/firmware.bin
          else
            exit 1
          fi

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32c3-firmware
          path: output_bin/firmware.bin
