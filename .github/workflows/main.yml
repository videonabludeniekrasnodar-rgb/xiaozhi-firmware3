name: Build ESPHome Firmware

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create ESPHome config
        run: |
          cat << 'EOF' > config.yaml
          esphome:
            name: xiaozhi-radio

          esp32:
            board: esp32-c3-devkitm-1
            framework:
              type: arduino # Облегченный фреймворк для быстрой сборки без багов

          wifi:
            ssid: "ИМЯ_ВАШЕГО_WIFI"
            password: "ПАРОЛЬ_ОТ_WIFI"

          web_server:
            port: 80
            version: 3

          logger:
          api:

          # Датчик уровня Wi-Fi для нашей графической шкалы
          sensor:
            - platform: wifi_signal
              id: wifi_signal_db
              update_interval: 5s

          # Точные пины I2C с вашей фотографии платы (SDA=10, SCL=8)
          i2c:
            sda: GPIO10
            scl: GPIO08

          # Подключение OLED дисплея SSD1306 (Чистая графика)
          display:
            - platform: ssd1306_i2c
              model: "SSD1306 128x64"
              address: 0x3C          
              id: oled_display
              lambda: |-
                // --- ВЕРХНЯЯ ЧАСТЬ: Рисуем красивую рамку ---
                it.rectangle(10, 10, 108, 15);
                it.filled_rectangle(12, 12, 50, 11); // Закрасим половинку для теста экрана
                
                // --- НИЖНЯЯ ЧАСТЬ: Графический индикатор качества Wi-Fi ---
                it.line(0, 40, 128, 40);
                
                float signal = id(wifi_signal_db).state;
                int bar_width = (int)(signal + 100) * 2;
                if (bar_width < 0) bar_width = 0;
                if (bar_width > 128) bar_width = 128;
                
                it.filled_rectangle(0, 55, bar_width, 8);
          EOF

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ESPHome
        run: pip install esphome

      - name: Compile Firmware
        run: esphome compile config.yaml

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32c3-firmware
          path: .esphome/build/xiaozhi-radio/firmware-factory.bin
