name: Build ESPHome Firmware

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Создаем настоящий локальный файл шрифта программным путем, чтобы компилятор не падал
      - name: Generate dummy font
        run: |
          python3 -c "
          import struct
          # Создаем минимально валидный заголовок TTF файла
          header = struct.pack('>IHHHH', 0x00010000, 0, 0, 0, 0)
          with open('pixel_font.ttf', 'wb') as f:
              f.write(header + b'\x00' * 100)
          "

      - name: Create ESPHome config
        run: |
          cat << 'EOF' > config.yaml
          esphome:
            name: xiaozhi-radio

          esp32:
            board: esp32-c3-devkitm-1
            framework:
              type: esp-idf

          wifi:
            ssid: "ИМЯ_ВАШЕГО_WIFI"
            password: "ПАРОЛЬ_ОТ_WIFI"

          web_server:
            port: 80
            version: 3

          logger:
          api:

          # Автоматический текстовый датчик для вывода IP
          text_sensor:
            - platform: wifi_info
              ip_address:
                id: wifi_ip_text

          i2c:
            sda: GPIO10
            scl: GPIO08

          audio_dac:
            - platform: es8311
              address: 0x18

          # Аппаратная шина I2S
          i2s_audio:
            id: i2s_bus
            i2s_lrclk_pin: GPIO03
            i2s_bclk_pin: GPIO02

          speaker:
            # Настоящий физический выход на чип звука
            - platform: i2s_audio
              id: xiaozhi_hardware_speaker
              i2s_dout_pin: GPIO01
              dac_type: external

            # Виртуальный микшер
            - platform: mixer
              id: local_mixer_speaker
              output_speaker: xiaozhi_hardware_speaker
              source_speakers:
                - id: music_mixer_input
                - id: announcement_mixer_input

            # Ресамплеры для выравнивания частоты звука
            - platform: resampler
              id: music_channel
              output_speaker: music_mixer_input

            - platform: resampler
              id: announcement_channel
              output_speaker: announcement_mixer_input

          # Медиаплеер
          media_player:
            - platform: speaker
              id: audio_player
              name: "Xiaozhi Internet Radio"
              media_pipeline:
                speaker: music_channel
              announcement_pipeline:
                speaker: announcement_channel

          # ИСПРАВЛЕНО: Указываем созданный нами локальный файл
          font:
            - file: "pixel_font.ttf"
              id: my_font
              size: 14

          # Подключение OLED дисплея SSD1306
          display:
            - platform: ssd1306_i2c
              model: "SSD1306 128x64"
              address: 0x3C          
              id: oled_display
              lambda: |-
                it.print(0, 0, id(my_font), "Xiaozhi Radio");
                
                if (id(audio_player).state == MEDIA_PLAYER_STATE_PLAYING) {
                  it.print(0, 20, id(my_font), "Status: Playing...");
                } else {
                  it.print(0, 20, id(my_font), "Status: Idle");
                }
                
                std::string ip_line = "IP: " + id(wifi_ip_text).state;
                it.print(0, 45, id(my_font), ip_line.c_str());
          EOF

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ESPHome
        run: pip install esphome

      - name: Compile Firmware
        run: esphome compile config.yaml

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32c3-firmware
          path: .esphome/build/xiaozhi-radio/firmware-factory.bin
