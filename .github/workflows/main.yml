name: Build ESPHome Firmware

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create ESPHome config
        run: |
          cat << 'EOF' > config.yaml
          esphome:
            name: xiaozhi-radio

          esp32:
            board: esp32-c3-devkitm-1
            framework:
              type: arduino

          wifi:
            ssid: "Keenetic"
            password: "123456789"

          web_server:
            port: 80
            version: 3

          logger:
          api:

          sensor:
            - platform: wifi_signal
              id: wifi_signal_db
              update_interval: 5s

          # Точные пины I2C с вашей фотографии платы
          i2c:
            sda: GPIO10
            scl: GPIO08

          # Проверенная платформа дисплея
          display:
            - platform: ssd1306_i2c
              model: "SSD1306 128x64"
              address: 0x3C          
              id: oled_display
              lambda: |-
                it.rectangle(10, 10, 108, 15, COLOR_ON);
                it.filled_rectangle(12, 12, 50, 11, COLOR_ON);
                
                it.line(0, 40, 128, 40, COLOR_ON);
                
                float signal = id(wifi_signal_db).state;
                if (!isnan(signal)) {
                  int bar_width = (int)(signal + 100) * 2;
                  if (bar_width < 0) bar_width = 0;
                  if (bar_width > 128) bar_width = 128;
                  
                  it.filled_rectangle(0, 55, bar_width, 8, COLOR_ON);
                }
          EOF

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ESPHome
        run: pip install esphome

      - name: Compile Firmware
        run: esphome compile config.yaml

      # УМНЫЙ ХОД: Ищем любой готовый factory/объединенный бинарник и копируем в корень репозитория
      - name: Find and Prepare Firmware File
        run: |
          mkdir -p output_bin
          FIND_FACTORY=$(find .esphome/build/ -type f -name "*factory.bin" | head -n 1)
          if [ -n "$FIND_FACTORY" ]; then
            echo "Найдена factory-прошивка: $FIND_FACTORY"
            cp "$FIND_FACTORY" output_bin/firmware.bin
          else
            FIND_ANY=$(find .esphome/build/ -type f -name "*.bin" | head -n 1)
            echo "Factory не найден, берем обычный бинарник: $FIND_ANY"
            cp "$FIND_ANY" output_bin/firmware.bin
          fi

      # Скачиваем файл из нашей гарантированно существующей папки output_bin
      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32c3-firmware
          path: output_bin/firmware.bin
